<!doctype html>
<html lang="en">
<head>

  <title>MyAppsUptime - Mobile preview</title>

  <figure><div class="phone"><iframe src="index.html"></iframe></div><figcaption>Dashboard (light)</figcaption></figure>
  <figure><div class="phone"><iframe src="index.html#dark"></iframe></div><figcaption>Dashboard (dark)</figcaption></figure>
