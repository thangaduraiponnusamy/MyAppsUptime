services:
  myappsuptime:
    build: .
    image: myappsuptime:latest
    container_name: myappsuptime
    ports:
      - "8000:8000"
    environment:
      API_TOKEN: ${API_TOKEN:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - myappsuptime-data:/data
    restart: unless-stopped

volumes:
  myappsuptime-data:
