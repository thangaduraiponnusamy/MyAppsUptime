name: Build

on:
  push:
    branches: [main, develop, "release/**", "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Pull requests: compile only, no Docker image
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build UI
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          NG_CLI_ANALYTICS=false npx ng build --configuration production

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m compileall -q app
          python -c "import app.main"

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version info
        id: v
        run: |
          echo "ts=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          # branch name without prefix; Docker tags allow only A-Z a-z 0-9 _ . -
          name=$(echo "${GITHUB_REF_NAME#*/}" | sed 's/[^A-Za-z0-9_.-]/-/g')
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=lts,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.v.outputs.ts }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=beta-${{ steps.v.outputs.ts }},enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.v.outputs.name }},enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=raw,value=${{ steps.v.outputs.name }}-${{ steps.v.outputs.ts }},enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=raw,value=alpha-${{ steps.v.outputs.name }},enable=${{ startsWith(github.ref, 'refs/heads/feature/') }}
            type=raw,value=alpha-${{ steps.v.outputs.name }}-${{ steps.v.outputs.ts }},enable=${{ startsWith(github.ref, 'refs/heads/feature/') }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
