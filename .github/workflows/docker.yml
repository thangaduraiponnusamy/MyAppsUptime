name: Docker image

on:
  push:
    branches: [main, develop, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version info
        id: v
        run: |
          echo "ts=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "release=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=lts,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.v.outputs.ts }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=beta-${{ steps.v.outputs.ts }},enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.v.outputs.release }},enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=raw,value=${{ steps.v.outputs.release }}-${{ steps.v.outputs.ts }},enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=ref,event=tag
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
